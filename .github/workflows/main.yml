name: Test, Build, and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      release_windows:
        description: 'Release Windows'
        type: boolean
        default: false
      increment_version:
        description: 'Increment version'
        type: choice
        default: ''
        options:
          - ''
          - revision
          - patch
          - minor
          - major
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'src/NetWorthTracker.UI/node/package-lock.json'

      - name: Install Node Dependencies
        working-directory: ./src/NetWorthTracker.UI/node
        run: npm ci

      - name: Compile Tailwind CSS
        working-directory: ./src/NetWorthTracker.UI/node
        run: npm run build:css:minify

      - name: Upload Tailwind CSS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailwind-css
          path: src/NetWorthTracker.UI/wwwroot/css/app.css
          retention-days: 1

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run Data Tests
        run: dotnet test tests/NetWorthTracker.Data.Tests/NetWorthTracker.Data.Tests.csproj --configuration Release --verbosity normal

      - name: Run UI Tests
        run: dotnet test tests/NetWorthTracker.UI.Tests/NetWorthTracker.UI.Tests.csproj --configuration Release --verbosity normal

  getVersionFromGit:
    name: Get Git Version
    runs-on: ubuntu-latest
    outputs:
      buildVersion: ${{ steps.getVersion.outputs.buildVersion }}
      tagVersion: ${{ steps.getVersion.outputs.tagVersion }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make increment_version.sh executable
        run: chmod +x ./scripts/increment_version.sh

      - name: Get version
        id: getVersion
        run: ./scripts/increment_version.sh "${{ github.event.inputs.increment_version }}"

  buildForWindows:
    name: Build for Windows
    needs: [ test, getVersionFromGit ]
    if: |
      github.event.action == 'published'
      || github.event.inputs.release_windows == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.getVersionFromGit.outputs.buildVersion }}
    secrets: inherit

  deployWindowsRelease:
    name: Deploy Windows Release
    needs: [ getVersionFromGit, buildForWindows ]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.buildForWindows.result == 'success' &&
      (github.event.inputs.release_windows == 'true' || github.event.action == 'published')

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: dist

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.getVersionFromGit.outputs.tagVersion }}
          name: Release ${{ needs.getVersionFromGit.outputs.tagVersion }}
          draft: false
          prerelease: false
          files: |
            dist/*.msix
            dist/*.cer
          generate_release_notes: true
