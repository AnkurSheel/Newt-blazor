name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    outputs:
      buildVersion:
        value: ${{ inputs.version }}

jobs:
  build_windows:
    name: Build & Package MSIX
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Tailwind CSS Artifact
        uses: actions/download-artifact@v4
        with:
          name: tailwind-css
          path: src/NetWorthTracker.UI/wwwroot/css

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            C:\Users\runneradmin\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache MAUI Workload
        id: cache-maui-workload
        uses: actions/cache@v6
        with:
          path: |
            C:\Program Files\dotnet\packs
            C:\Program Files\dotnet\sdk-manifests
            C:\Program Files\dotnet\template-packs
            C:\Program Files\dotnet\metadata
          key: ${{ runner.os }}-maui-workload-net9-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-maui-workload-net9-

      - name: Install MAUI Workload
        if: steps.cache-maui-workload.outputs.cache-hit != 'true'
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Configure Code Signing Certificate
        id: cert_setup
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
              Write-Error "Certificate secret WINDOWS_CERTIFICATE_BASE64 was not found."
              exit 1
          }

          $stagingDir = "$PWD/dist"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          
          Write-Host "Importing certificate from GitHub Secrets..."
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          $pfxPath = "$stagingDir/cert.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, $certBytes)
          
          $pfx = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath,
              $env:WINDOWS_CERTIFICATE_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable -bor [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet
          )
          
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new("My", "CurrentUser")
          $store.Open("ReadWrite")
          $store.Add($pfx)
          $store.Close()
          
          $thumbprint = $pfx.Thumbprint
          $cerBytes = $pfx.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [System.IO.File]::WriteAllBytes("$stagingDir/NetWorthTracker.cer", $cerBytes)
          
          Write-Host "Certificate Thumbprint: $thumbprint"
          "THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

      - name: Update Package Manifest Version
        shell: pwsh
        run: |
          $manifestPath = "src/NetWorthTracker.App/Platforms/Windows/Package.appxmanifest"
          $buildVer = "${{ inputs.version }}"
          Write-Host "Updating $manifestPath version to $buildVer"
          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Version = $buildVer
          $manifest.Save((Resolve-Path $manifestPath))

      - name: Configure Syncfusion License Key
        shell: pwsh
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY || secrets.SYNCFUSION_KEY }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SYNCFUSION_LICENSE_KEY)) {
              Write-Host "Injecting Syncfusion license key into appsettings.json..."
              $appSettingsPath = "src/NetWorthTracker.App/appsettings.json"
              $json = Get-Content -Raw -Path $appSettingsPath | ConvertFrom-Json
              $json | Add-Member -NotePropertyName "Syncfusion" -NotePropertyValue ([PSCustomObject]@{ LicenseKey = $env:SYNCFUSION_LICENSE_KEY }) -Force
              $json | ConvertTo-Json -Depth 10 | Set-Content -Path $appSettingsPath
              Write-Host "Syncfusion license key successfully injected."
          } else {
              Write-Warning "SYNCFUSION_LICENSE_KEY secret not found or empty. Syncfusion license will not be registered."
          }

      - name: Build & Publish MSIX Package
        shell: pwsh
        run: |
          $buildVer = "${{ inputs.version }}"
          dotnet publish src/NetWorthTracker.App/NetWorthTracker.App.csproj `
            -f net9.0-windows10.0.19041.0 `
            -c Release `
            /p:WindowsPackageType=MSIX `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="$env:THUMBPRINT" `
            /p:ApplicationDisplayVersion="$buildVer" `
            /p:ApplicationVersion="$buildVer"

      - name: Collect and Rename Build Artifacts
        shell: pwsh
        run: |
          $buildVer = "${{ inputs.version }}"
          $packagesDir = "src/NetWorthTracker.App/bin/Release/net9.0-windows10.0.19041.0/win10-x64/AppPackages"
          $msix = Get-ChildItem -Path $packagesDir -Filter "*.msix" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          
          if ($null -eq $msix) {
              Write-Error "No .msix file found in $packagesDir"
              exit 1
          }
          
          $targetName = "NetWorthTracker-$buildVer.msix"
          Copy-Item -Path $msix.FullName -Destination "dist/$targetName"
          Write-Host "Staged $targetName to dist/"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-Windows
          path: |
            dist/*.msix
            dist/*.cer
          retention-days: 14
